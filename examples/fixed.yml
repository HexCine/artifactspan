name: Artifact flow example
on: push
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - run: echo synthetic > result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.os }}
          path: result.txt
  consume:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: result-ubuntu-latest
          path: linux
      - uses: actions/download-artifact@v4
        with:
          name: result-windows-latest
          path: windows
